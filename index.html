<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Adventure Album — Digital Journey & Summit Archive</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
              950: '#022c22',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS (100% Free, Zero API Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover:hover {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 12px 30px -10px rgba(16, 185, 129, 0.2);
    }
    .leaflet-popup-content-wrapper {
      background: #18181b !important;
      color: #f4f4f5 !important;
      border: 1px solid #27272a;
      border-radius: 18px;
      box-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.8);
      padding: 3px;
    }
    .leaflet-popup-content { margin: 8px 10px !important; line-height: 1.4 !important; }
    .leaflet-popup-tip { background: #18181b !important; }
    .custom-marker-pin { position: relative; }
    .custom-marker-pin::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.45);
      animation: pin-radar 2s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      z-index: -1;
    }
    @keyframes pin-radar {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Glow -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-emerald-500/10 rounded-full blur-[130px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-0 w-[500px] h-[300px] bg-teal-500/5 rounded-full blur-[120px] pointer-events-none -z-10"></div>

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/80 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo -->
        <div onclick="navigateTo('home')" class="flex items-center gap-3 cursor-pointer group select-none">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-700 to-zinc-800 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:border-emerald-400/60 transition-colors">
            <i data-lucide="mountain" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="font-bold tracking-tight text-base sm:text-lg text-zinc-100 group-hover:text-emerald-400 transition-colors">
              My Adventure Album
            </div>
            <p class="text-[10px] text-zinc-400 font-normal tracking-wide hidden sm:block">Catatan Perjalanan & Dokumentasi Jalur</p>
          </div>
        </div>

        <div class="flex items-center gap-2 text-xs text-zinc-400 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>Arsip Terbuka</span>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main id="app-viewport" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"></main>

  <!-- LIGHTBOX VIEWER MODAL -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex-col items-center justify-center p-4 transition-all" onclick="closeLightbox()">
    <button aria-label="Tutup" class="absolute top-5 right-5 text-zinc-400 hover:text-white p-3 rounded-full bg-zinc-900/90 border border-zinc-700/80 transition-all">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
    <div class="max-w-4xl w-full flex flex-col items-center space-y-3" onclick="event.stopPropagation()">
      <img id="lightbox-image" src="" alt="Dokumentasi Fullsize" class="max-h-[75vh] w-auto max-w-full object-contain rounded-2xl shadow-2xl border border-zinc-800" />
      <p id="lightbox-caption" class="text-xs sm:text-sm text-zinc-200 bg-zinc-900/95 border border-zinc-700/80 px-5 py-2.5 rounded-xl text-center max-w-2xl font-medium"></p>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 pointer-events-none flex flex-col gap-2"></div>

  <!-- FOOTER -->
  <footer class="border-t border-zinc-900/90 bg-zinc-950/80 py-8 text-xs text-zinc-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-zinc-300 font-bold">My Adventure Album</span>
        <span>&bull; Every journey has a story</span>
      </div>
      <div class="flex items-center gap-4 text-zinc-400">
        <button onclick="navigateTo('home')" class="hover:text-emerald-400 transition-colors">Beranda</button>
        <!-- Discreet trigger for admin -->
        <button onclick="navigateTo('admin')" class="text-zinc-700 hover:text-emerald-400 transition-colors font-mono text-[11px]">
          [Admin Panel]
        </button>
      </div>
    </div>
  </footer>

  <!-- APP LOGIC -->
  <script>
    const SEED_DATA = [
      {
        id: "trip-raung-01",
        title: "Ekspedisi Kaldera Gunung Raung",
        slug: "gunung-raung",
        location: "Gunung Raung, Banyuwangi - Bondowoso",
        latitude: -8.125194,
        longitude: 114.042306,
        date: "2026-07-15",
        category: "Pendakian",
        featured: true,
        elevation: "3.344 MDPL",
        description: "Menapaki jalur punggungan cadas Shiratal Mustaqim yang legendaris menuju Puncak Sejati 3.344 MDPL. Kawah kaldera aktif raksasa dengan diameter 3 kilometer mengeluarkan kepulan asap belerang yang mempesona dan suara gemuruh yang menggetarkan dada di bawah taburan gugusan Galaksi Bima Sakti.",
        cover_image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80",
        photos: [
          { id: "p1", url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80", caption: "Panorama punggungan cadas Kaldera Raung di pagi hari" },
          { id: "p2", url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80", caption: "Bivak Camp 7 beratapkan langit penuh gugusan Galaksi Bima Sakti" },
          { id: "p3", url: "https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?auto=format&fit=crop&w=800&q=80", caption: "Puncak Bendera sebelum melintasi jembatan sempit jurang kembar" }
        ]
      },
      {
        id: "trip-nuanu-02",
        title: "Kreativitas Berkelanjutan di Nuanu City",
        slug: "nuanu-city-bali",
        location: "Nuanu, Tabanan, Bali",
        latitude: -8.5992,
        longitude: 115.1145,
        date: "2026-08-20",
        category: "Traveling",
        featured: true,
        elevation: "Pesisir Tebing",
        description: "Menjelajahi kawasan inovasi terpadu Nuanu City seluas 44 hektar di tepi tebing pantai Tabanan. Memadukan keindahan arsitektur ramah lingkungan berbahan bambu artisan, instalasi seni interaktif, dan komitmen konservasi pesisir yang menakjubkan.",
        cover_image: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1200&q=80",
        photos: [
          { id: "p4", url: "https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=800&q=80", caption: "Siluet pantai tebing barat daya saat matahari terbenam" },
          { id: "p5", url: "https://images.unsplash.com/photo-1544644181-1484b3fdfc62?auto=format&fit=crop&w=800&q=80", caption: "Kubah bambu artistik instalasi seni multi-kultural" }
        ]
      },
      {
        id: "trip-rinjani-03",
        title: "Pesona Danau Segara Anak Rinjani",
        slug: "danau-segara-anak-rinjani",
        location: "Gunung Rinjani, Lombok",
        latitude: -8.411283,
        longitude: 116.457317,
        date: "2026-06-10",
        category: "Pendakian",
        featured: false,
        elevation: "3.726 MDPL",
        description: "Perjalanan melintasi savana Sembalun, menggapai puncak Dewi Anjani 3.726 MDPL saat fajar, dan bermalam santai di tepi Danau Segara Anak sambil memancing dan menikmati mata air panas alami Aik Kalak.",
        cover_image: "https://images.unsplash.com/photo-1570789210967-2cac24afeb00?auto=format&fit=crop&w=1200&q=80",
        photos: [
          { id: "p6", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", caption: "Danau Segara Anak dengan anak Gunung Barujari di tengahnya" },
          { id: "p7", url: "https://images.unsplash.com/photo-1510312305653-8ed496efae75?auto=format&fit=crop&w=800&q=80", caption: "Padang sabana Sembalun membentang hijau tak berujung" }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_adventure_db_v5')) || SEED_DATA;

    function saveTrips() {
      localStorage.setItem('my_adventure_db_v5', JSON.stringify(trips));
    }

    let activePage = 'home';
    let activeSlug = null;
    let selectedCategory = 'Semua';
    let searchQuery = '';
    let sortOrder = 'newest';

    let isAdminLoggedIn = sessionStorage.getItem('adventure_admin_auth_v5') === 'true';
    let editingTripId = null;
    let adminCoverDataUrl = '';
    let adminGalleryList = [];

    let homeMapInstance = null;
    let detailMapInstance = null;
    let adminPickerMapInstance = null;
    let adminMarkerInstance = null;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold text-white pointer-events-auto flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0 ${type === 'success' ? 'bg-emerald-600 shadow-emerald-950' : 'bg-rose-600 shadow-rose-950'}`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i> <span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => toast.classList.remove('translate-y-3', 'opacity-0'), 50);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }

    // FUNGSI DOWNLOAD SOURCE CODE LANGSUNG
    function downloadSourceCode() {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "index.html";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("File index.html berhasil diunduh ke perangkat Anda!");
    }

    function navigateTo(page, slug = null) {
      activePage = page;
      activeSlug = slug;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function formatIndoDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (e) {
        return dateStr;
      }
    }

    function createMapPin(isSmall = false) {
      const size = isSmall ? 28 : 34;
      return L.divIcon({
        className: 'custom-marker-pin',
        html: `<div style="background-color: #10B981; color: white; border-radius: 9999px; width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.6); border: 2.5px solid #ffffff;">
                <svg width="${size * 0.5}" height="${size * 0.5}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
               </div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size],
        popupAnchor: [0, -size + 4]
      });
    }

    function renderApp() {
      const viewport = document.getElementById('app-viewport');
      if (activePage === 'home') renderHomePage(viewport);
      else if (activePage === 'detail') renderDetailPage(viewport);
      else if (activePage === 'admin') renderAdminPage(viewport);
      lucide.createIcons();
    }

    function renderHomePage(container) {
      let filtered = trips.filter(trip => {
        const matchCat = selectedCategory === 'Semua' || trip.category === selectedCategory;
        const matchSearch = trip.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            trip.location.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (sortOrder === 'newest') {
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      } else if (sortOrder === 'oldest') {
        filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
      } else if (sortOrder === 'title') {
        filtered.sort((a, b) => a.title.localeCompare(b.title));
      }

      const counts = {
        Semua: trips.length,
        Pendakian: trips.filter(t => t.category === 'Pendakian').length,
        Traveling: trips.filter(t => t.category === 'Traveling').length,
        Wisata: trips.filter(t => t.category === 'Wisata').length
      };

      container.innerHTML = `
        <div class="space-y-10">
          
          <!-- PETA TITIK LOKASI -->
          <section id="map-section" class="space-y-4">
            <div class="border-b border-zinc-800/80 pb-4 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div class="space-y-1.5">
                <span class="text-[11px] font-semibold tracking-wider text-emerald-400 uppercase font-mono">
                  Peta Geografis
                </span>
                <h1 class="text-xl sm:text-2xl font-bold text-zinc-100 tracking-tight">
                  Titik Singgah & Rute Ekspedisi
                </h1>
                <p class="text-xs sm:text-sm text-zinc-400 font-light italic max-w-xl leading-relaxed">
                  "Perjalanan adalah sebuah ruang temu antara langkah kaki, ketinggian mimpi, dan kisah yang diabadikan waktu."
                </p>
              </div>

              <div class="text-[11px] text-zinc-400 font-mono flex items-center gap-2 self-start md:self-end bg-zinc-900/80 border border-zinc-800 px-3 py-1.5 rounded-lg">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>${trips.length} Lokasi Terpetakan</span>
              </div>
            </div>

            <div class="relative rounded-2xl overflow-hidden border border-zinc-800 bg-zinc-900 shadow-xl">
              <div id="home-leaflet-map" class="h-64 sm:h-[380px] w-full z-10"></div>
            </div>
          </section>

          <!-- SEMUA KOLEKSI -->
          <section class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-zinc-800/80 pb-5">
              <div>
                <h2 class="text-2xl font-black text-white tracking-tight flex items-center gap-2.5">
                  <span>Semua Koleksi Perjalanan</span>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    ${filtered.length}
                  </span>
                </h2>
                <p class="text-xs text-zinc-400 mt-1">
                  Arsip dokumentasi foto, catatan jalur, dan rute perjalanan terpetakan.
                </p>
              </div>

              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div class="relative w-full sm:w-64">
                  <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                  <input 
                    type="text" 
                    value="${searchQuery}"
                    oninput="setSearchInput(this.value)"
                    placeholder="Cari tempat atau lokasi..."
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-8 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-emerald-500 transition-all placeholder:text-zinc-600"
                  />
                  ${searchQuery ? `
                    <button onclick="setSearchInput('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-200">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  ` : ''}
                </div>

                <div class="relative shrink-0">
                  <select 
                    onchange="setSortOrder(this.value)"
                    class="w-full sm:w-auto bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-zinc-300 focus:outline-none focus:border-emerald-500 cursor-pointer"
                  >
                    <option value="newest" ${sortOrder === 'newest' ? 'selected' : ''}>Terbaru</option>
                    <option value="oldest" ${sortOrder === 'oldest' ? 'selected' : ''}>Terlama</option>
                    <option value="title" ${sortOrder === 'title' ? 'selected' : ''}>Abjad (A-Z)</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Filter Pills -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
              ${['Semua', 'Pendakian', 'Traveling', 'Wisata'].map(cat => `
                <button 
                  onclick="setCategoryFilter('${cat}')" 
                  class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                    selectedCategory === cat 
                      ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' 
                      : 'bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700'
                  }"
                >
                  <span>${cat}</span>
                  <span class="text-[10px] px-1.5 py-0.2 rounded-md ${selectedCategory === cat ? 'bg-white/20 text-white' : 'bg-zinc-800 text-zinc-500'}">
                    ${counts[cat] || 0}
                  </span>
                </button>
              `).join('')}
            </div>

            <!-- Grid Card -->
            ${filtered.length === 0 ? `
              <div class="p-16 text-center rounded-3xl bg-zinc-900/40 border border-zinc-800/80 space-y-3">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800 flex items-center justify-center mx-auto text-zinc-500">
                  <i data-lucide="compass" class="w-6 h-6"></i>
                </div>
                <h3 class="text-base font-bold text-white">Tidak ada album yang sesuai</h3>
                <p class="text-xs text-zinc-400 max-w-sm mx-auto">
                  Coba gunakan kata kunci pencarian yang lain atau klik kategori "Semua".
                </p>
                <button onclick="setCategoryFilter('Semua'); setSearchInput('')" class="text-xs font-semibold text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-4 py-2 rounded-xl hover:bg-emerald-900/40 transition">
                  Reset Pencarian
                </button>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${filtered.map(trip => renderTripCard(trip)).join('')}
              </div>
            `}

          </section>

        </div>
      `;

      setTimeout(initHomeMap, 60);
    }

    function initHomeMap() {
      const mapContainer = document.getElementById('home-leaflet-map');
      if (!mapContainer) return;

      if (homeMapInstance) homeMapInstance.remove();

      homeMapInstance = L.map('home-leaflet-map', { scrollWheelZoom: false }).setView([-8.2, 114.5], 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(homeMapInstance);

      const bounds = [];
      trips.forEach(trip => {
        if (trip.latitude && trip.longitude) {
          const marker = L.marker([trip.latitude, trip.longitude], { icon: createMapPin(false) }).addTo(homeMapInstance);
          bounds.push([trip.latitude, trip.longitude]);

          const popupHtml = `
            <div style="font-family: inherit; width: 210px;">
              <img src="${trip.cover_image}" alt="${trip.title}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 12px; margin-bottom: 8px;" />
              <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 3px;">
                <span style="font-size: 10px; font-weight: 800; color: #34d399; text-transform: uppercase;">${trip.category}</span>
                ${trip.elevation ? `<span style="font-size: 9px; color: #a1a1aa; background: #27272a; padding: 1px 5px; border-radius: 4px;">${trip.elevation}</span>` : ''}
              </div>

                <div id="admin-leaflet-picker" class="h-64 sm:h-72 w-full bg-zinc-950 z-10"></div>
                <div class="absolute bottom-2 left-2 z-20 bg-zinc-950/90 backdrop-blur px-3 py-1.5 rounded-xl text-[10px] text-zinc-300 border border-zinc-800 font-medium">
                  Tip: Klik peta atau geser marker untuk mengubah koordinat
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                  <label class="text-[11px] text-zinc-400 font-semibold">Latitude</label>
                  <input 
                    id="admin-form-lat" 
                    type="number" 
                    step="any" 
                    required 
                    value="${currentEditingTrip ? currentEditingTrip.latitude : -8.125194}"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-mono text-emerald-400" 
                  />
                </div>
                <div class="space-y-1">
                  <label class="text-[11px] text-zinc-400 font-semibold">Longitude</label>
                  <input 
                    id="admin-form-lng" 
                    type="number" 
                    step="any" 
                    required 
                    value="${currentEditingTrip ? currentEditingTrip.longitude : 114.042306}"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-mono text-emerald-400" 
                  />
                </div>
              </div>
            </div>

            <!-- UPLOAD FOTO DARI FILE LOKAL -->
            <div class="space-y-6 border-t border-zinc-800 pt-6">
              <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="image" class="w-4 h-4 text-emerald-400"></i> 
                Upload Foto dari Galeri HP / Laptop (Bukan URL)
              </h3>

              <!-- Cover Photo Selection -->
              <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-400">1. Cover Utama Foto (Pilih dari HP / Laptop) *</label>
                <div class="flex flex-col sm:flex-row gap-4 items-start">
                  <div id="cover-preview-container" class="w-full sm:w-56 h-36 rounded-2xl border-2 border-dashed border-zinc-800 bg-zinc-950 flex flex-col items-center justify-center text-zinc-500 shrink-0 overflow-hidden relative shadow-md">
                    ${adminCoverDataUrl ? `
                      <img src="${adminCoverDataUrl}" alt="Cover preview" class="w-full h-full object-cover rounded-2xl" />
                      <button type="button" onclick="clearCoverPreview()" class="absolute top-2 right-2 bg-black/70 hover:bg-rose-600 text-white p-1.5 rounded-full text-xs">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                      </button>
                    ` : `
                      <i data-lucide="camera" class="w-7 h-7 mb-1 text-zinc-600"></i>
                      <span class="text-[11px]">Belum ada cover</span>
                    `}
                  </div>

                  <div class="flex-1 space-y-2">
                    <input 
                      id="admin-cover-input" 
                      type="file" 
                      accept="image/*" 
                      onchange="handleCoverFileSelected(event)"
                      class="block w-full text-xs text-zinc-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer bg-zinc-950 p-2 rounded-2xl border border-zinc-800" 
                    />
                    <p class="text-[11px] text-zinc-500">
                      Pilih foto cover baru kapan saja untuk mengganti cover lama.
                    </p>
                  </div>
                </div>
              </div>

              <!-- Gallery Photos Selection -->
              <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between">
                  <div>
                    <label class="block text-xs font-semibold text-zinc-400">2. Tambah Foto Galeri (Bisa pilih banyak sekaligus)</label>
                    <p class="text-[11px] text-zinc-500">Foto yang dipilih akan langsung ditambahkan ke galeri album ini</p>
                  </div>
                  <span id="gallery-count-badge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-full font-mono font-bold">
                    ${adminGalleryList.length} Foto
                  </span>
                </div>

                <input 
                  type="file" 
                  accept="image/*" 
                  multiple 
                  onchange="handleGalleryFilesSelected(event)"
                  class="block w-full text-xs text-zinc-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer bg-zinc-950 p-2 rounded-2xl border border-zinc-800" 
                />

                <div id="gallery-items-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2"></div>
              </div>
            </div>

            <!-- Featured Checkbox -->
            <div class="flex items-center gap-3 border-t border-zinc-800 pt-4">
              <input 
                id="admin-form-featured" 
                type="checkbox" 
                ${currentEditingTrip?.featured ? 'checked' : ''}
                class="w-4 h-4 rounded bg-zinc-950 border-zinc-800 text-emerald-600 focus:ring-emerald-500" 
              />
              <label for="admin-form-featured" class="text-xs text-zinc-300 font-medium">
                Tampilkan sebagai Album Unggulan di bagian atas
              </label>
            </div>

            <!-- Submit Button Bar -->
            <div class="border-t border-zinc-800 pt-6 flex flex-col sm:flex-row items-center gap-3">
              <button 
                type="submit" 
                class="w-full sm:flex-1 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-xl shadow-emerald-600/30 flex items-center justify-center gap-2 transition active:scale-95"
              >
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>${editingTripId ? 'Simpan Perubahan Album' : 'Simpan Perjalanan Baru'}</span>
              </button>

              ${editingTripId ? `
                <button 
                  type="button" 
                  onclick="cancelEditMode()"
                  class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold text-xs transition"
                >
                  Batal
                </button>
              ` : ''}
            </div>

          </form>
        </div>
      `;

      setTimeout(() => {
        initAdminPickerMap(currentEditingTrip?.latitude, currentEditingTrip?.longitude);
        renderGalleryPreviews();
      }, 60);
    }

    function startEditTrip(tripId) {
      const target = trips.find(t => t.id === tripId);
      if (!target) return;

      editingTripId = tripId;
      adminCoverDataUrl = target.cover_image;
      adminGalleryList = target.photos ? JSON.parse(JSON.stringify(target.photos)) : [];

      if (activePage !== 'admin') {
        isAdminLoggedIn = true;
        sessionStorage.setItem('adventure_admin_auth_v5', 'true');
        navigateTo('admin');
      } else {
        renderApp();
      }

      showToast(`Mengedit album "${target.title}"`);
    }

    function cancelEditMode() {
      editingTripId = null;
      adminCoverDataUrl = '';
      adminGalleryList = [];
      renderApp();
      showToast('Mode edit dibatalkan');
    }

    function renderAdminLogin(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto my-12 glass-card p-8 rounded-3xl shadow-2xl space-y-6">
          <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-emerald-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-emerald-600/30">
              <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h2 class="text-2xl font-black text-white">Login Kontrol Panel</h2>
            <p class="text-xs text-zinc-400">Masuk untuk mengelola data album, upload foto, dan menentukan koordinat peta.</p>
          </div>

          <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div class="space-y-1">
              <label class="text-xs font-semibold text-zinc-400">Username</label>
              <input id="login-username" type="text" required placeholder="admin" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-emerald-500" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-zinc-400">Password</label>
              <input id="login-password" type="password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-emerald-500" />
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 transition">
              Masuk ke Kontrol Panel
            </button>
          </form>
        </div>
      `;
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();

      if (u === 'admin' && p === 'adventure2026') {
        isAdminLoggedIn = true;
        sessionStorage.setItem('adventure_admin_auth_v5', 'true');
        showToast('Login berhasil!');
        renderApp();
      } else {
        showToast('Username atau password salah!', 'error');
      }
    }

    function handleAdminLogout() {
      isAdminLoggedIn = false;
      sessionStorage.removeItem('adventure_admin_auth_v5');
      editingTripId = null;
      showToast('Berhasil keluar dari admin');
      navigateTo('home');
    }

    function resetDefaultSeedData() {
      if (!confirm('Kembalikan semua album ke data contoh awal?')) return;
      trips = JSON.parse(JSON.stringify(SEED_DATA));
      saveTrips();
      editingTripId = null;
      showToast('Data template berhasil direset');
      renderApp();
    }

    function deleteTrip(id) {
      const target = trips.find(t => t.id === id);
      if (!target) return;
      if (!confirm(`Hapus album "${target.title}"?`)) return;

      trips = trips.filter(t => t.id !== id);
      saveTrips();
      if (editingTripId === id) editingTripId = null;
      showToast('Album berhasil dihapus');
      renderApp();
    }

    function initAdminPickerMap(initialLat, initialLng) {
      const el = document.getElementById('admin-leaflet-picker');
      if (!el) return;

      if (adminPickerMapInstance) adminPickerMapInstance.remove();

      const lat = initialLat !== undefined ? initialLat : -8.125194;
      const lng = initialLng !== undefined ? initialLng : 114.042306;

      adminPickerMapInstance = L.map('admin-leaflet-picker').setView([lat, lng], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(adminPickerMapInstance);

      adminMarkerInstance = L.marker([lat, lng], {
        draggable: true,
        icon: createMapPin(false)
      }).addTo(adminPickerMapInstance);

      adminMarkerInstance.on('dragend', function(e) {
        const pos = e.target.getLatLng();
        document.getElementById('admin-form-lat').value = pos.lat.toFixed(6);
        document.getElementById('admin-form-lng').value = pos.lng.toFixed(6);
      });

      adminPickerMapInstance.on('click', function(e) {
        adminMarkerInstance.setLatLng(e.latlng);
        document.getElementById('admin-form-lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('admin-form-lng').value = e.latlng.lng.toFixed(6);
      });
    }

    async function searchLocationGeocode() {
      const input = document.getElementById('geo-search-input');
      const dropdown = document.getElementById('geo-results-dropdown');
      const q = input.value.trim();

      if (!q) {
        showToast('Masukkan nama tempat yang ingin dicari', 'error');
        return;
      }

      dropdown.classList.remove('hidden');
      dropdown.innerHTML = '<div class="p-3 text-xs text-zinc-400 animate-pulse flex items-center gap-2"><i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Mencari lokasi di peta...</div>';
      lucide.createIcons();

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&addressdetails=1`);
        const data = await response.json();

        if (data.length === 0) {
          dropdown.innerHTML = '<div class="p-3 text-xs text-zinc-500">Lokasi tidak ditemukan. Coba nama kota atau landmark.</div>';
          return;
        }

        dropdown.innerHTML = data.map((item) => `
          <div 
            onclick="selectGeocodeResult(${item.lat}, ${item.lon}, '${item.display_name.replace(/'/g, "\\'")}')" 
            class="p-3 hover:bg-zinc-800 cursor-pointer transition text-left space-y-0.5"
          >
            <div class="text-xs font-bold text-white flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-3 h-3 text-emerald-400"></i>
              <span>${item.display_name.split(',')[0]}</span>
            </div>
            <div class="text-[11px] text-zinc-400 truncate">${item.display_name}</div>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (err) {
        dropdown.innerHTML = '<div class="p-3 text-xs text-rose-400">Gagal mencari. Periksa koneksi internet Anda.</div>';
      }
    }

    function selectGeocodeResult(lat, lon, fullAddress) {
      const latitude = parseFloat(lat);
      const longitude = parseFloat(lon);
      const placeName = fullAddress.split(',')[0];

      document.getElementById('admin-form-lat').value = latitude.toFixed(6);
      document.getElementById('admin-form-lng').value = longitude.toFixed(6);
      document.getElementById('admin-form-location').value = placeName;
      document.getElementById('geo-results-dropdown').classList.add('hidden');

      if (adminPickerMapInstance && adminMarkerInstance) {
        adminPickerMapInstance.setView([latitude, longitude], 13);
        adminMarkerInstance.setLatLng([latitude, longitude]);
      }

      showToast(`Lokasi dipilih: ${placeName}`);
    }

    function compressImageFile(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleCoverFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      compressImageFile(file, 1100, 0.76, function(dataUrl) {
        adminCoverDataUrl = dataUrl;
        const container = document.getElementById('cover-preview-container');
        container.innerHTML = `
          <img src="${adminCoverDataUrl}" alt="Cover preview" class="w-full h-full object-cover rounded-2xl" />
          <button type="button" onclick="clearCoverPreview()" class="absolute top-2 right-2 bg-black/70 hover:bg-rose-600 text-white p-1.5 rounded-full text-xs">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;
        lucide.createIcons();
      });
    }

    function clearCoverPreview() {
      adminCoverDataUrl = '';
      const input = document.getElementById('admin-cover-input');
      if (input) input.value = '';
      const container = document.getElementById('cover-preview-container');
      if (container) {
        container.innerHTML = `
          <i data-lucide="camera" class="w-7 h-7 mb-1 text-zinc-600"></i>
          <span class="text-[11px]">Belum ada cover</span>
        `;
        lucide.createIcons();
      }
    }

    function handleGalleryFilesSelected(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      files.forEach(file => {
        compressImageFile(file, 850, 0.74, function(dataUrl) {
          const item = {
            id: 'photo-' + Math.random().toString(36).substring(5),
            url: dataUrl,
            caption: file.name.replace(/\.[^/.]+$/, "")
          };
          adminGalleryList.push(item);
          renderGalleryPreviews();
        });
      });
    }

    function renderGalleryPreviews() {
      const container = document.getElementById('gallery-items-container');
      const badge = document.getElementById('gallery-count-badge');
      if (!container) return;

      if (badge) badge.innerText = `${adminGalleryList.length} Foto`;

      container.innerHTML = adminGalleryList.map((item, idx) => `
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-2.5 relative space-y-2">
          <button 
            type="button" 
            onclick="removeGalleryPhoto(${idx})" 
            class="absolute top-4 right-4 bg-rose-600 hover:bg-rose-500 text-white rounded-full p-1 text-xs shadow-lg z-10"
          >
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
          <div class="h-28 w-full rounded-xl overflow-hidden bg-black">
            <img src="${item.url}" alt="Gallery item" class="w-full h-full object-cover" />
          </div>
          <input 
            type="text" 
            value="${item.caption || ''}" 
            onchange="updateGalleryCaption(${idx}, this.value)"
            placeholder="Tulis caption foto..." 
            class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-[11px] text-zinc-300 focus:outline-none focus:border-emerald-500"
          />
        </div>
      `).join('');
      lucide.createIcons();
    }

    function removeGalleryPhoto(index) {
      adminGalleryList.splice(index, 1);
      renderGalleryPreviews();
    }

    function updateGalleryCaption(index, text) {
      if (adminGalleryList[index]) {
        adminGalleryList[index].caption = text;
      }
    }

    function handleAdminSubmit(event) {
      event.preventDefault();

      const title = document.getElementById('admin-form-title').value.trim();
      const category = document.getElementById('admin-form-category').value;
      const location = document.getElementById('admin-form-location').value.trim();
      const date = document.getElementById('admin-form-date').value;
      const elevation = document.getElementById('admin-form-elevation').value.trim();
      const description = document.getElementById('admin-form-description').value.trim();
      const lat = parseFloat(document.getElementById('admin-form-lat').value);
      const lng = parseFloat(document.getElementById('admin-form-lng').value);
      const featured = document.getElementById('admin-form-featured').checked;

      const cover = adminCoverDataUrl || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80';

      if (editingTripId) {
        const index = trips.findIndex(t => t.id === editingTripId);
        if (index !== -1) {
          trips[index] = {
            ...trips[index],
            title,
            category,
            location,
            date,
            elevation: elevation || trips[index].elevation,
            description,
            latitude: isNaN(lat) ? trips[index].latitude : lat,
            longitude: isNaN(lng) ? trips[index].longitude : lng,
            featured,
            cover_image: cover,
            photos: [...adminGalleryList]
          };

          saveTrips();
          showToast(`Album "${title}" berhasil diperbarui!`);
          const updatedSlug = trips[index].slug;
          editingTripId = null;
          navigateTo('detail', updatedSlug);
          return;
        }
      }

      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '') + '-' + Date.now().toString().slice(-4);

      const newTrip = {
        id: 'trip-' + Date.now(),
        title,
        slug: slug || 'adventure-' + Date.now(),
        location,
        latitude: isNaN(lat) ? -8.125 : lat,
        longitude: isNaN(lng) ? 114.042 : lng,
        date,
        elevation: elevation || (category === 'Pendakian' ? 'Puncak' : 'Jelajah'),
        category,
        featured,
        description,
        cover_image: cover,
        photos: adminGalleryList.length > 0 ? [...adminGalleryList] : [
          { id: 'p-' + Date.now(), url: cover, caption: title }
        ]
      };

      trips.unshift(newTrip);
      saveTrips();

      showToast(`Album "${newTrip.title}" berhasil disimpan!`);
      navigateTo('detail', newTrip.slug);
    }

    renderApp();
  </script>
</body>
